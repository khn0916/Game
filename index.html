<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>미니게임 - 19단계 (난이도 선택 및 발악 패턴)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 12px;
    display: flex; flex-direction: column; justify-content: center;
    align-items: center; gap: 10px;
    background: #222; color: white; font-family: sans-serif;
  }
  #bar {
    width: min(100%, 900px); display: flex; align-items: center;
    justify-content: center; flex-wrap: wrap; gap: 10px;
  }
  #status { padding: 6px 16px; background: #333; border-radius: 8px; font-size: .95rem; }
  #pauseBtn { padding: 5px 14px; font-size: .9rem; }
  #accessibilityControls {
    display: flex; align-items: center; justify-content: center;
    flex-wrap: wrap; gap: 8px 14px; padding: 7px 12px;
    border: 1px solid #666; border-radius: 8px; background: #303030;
    font-size: .9rem;
  }
  #accessibilityControls label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  #accessibilityControls input { width: 18px; height: 18px; accent-color: #9bd; }
  #effectStatus { color: #ddd; }
  #gameCanvas {
    display: none; width: min(800px, calc(100vw - 32px), calc(var(--canvas-h, 540px) * 4 / 3));
    height: auto; background: #555; border: 2px solid #777;
  }
  #menu { display: flex; flex-direction: column; gap: 20px; text-align: center; }
  #menu h1 { font-size: 3rem; margin: .67em 0 10px; }
  #menu p { margin: 1em 0 20px; }
  #help {
    width: min(100%, 850px); box-sizing: border-box;
    font-size: .88rem; line-height: 1.6; color: #ccc; text-align: center;
  }
  #help p { margin: 2px 0; }
  kbd { padding: 1px 6px; border: 1px solid #888; border-radius: 4px; background: #333; font-family: inherit; }
  button {
    padding: 15px 30px; font-size: 1.2rem; font-weight: bold;
    cursor: pointer; background: #fff; color: #111;
    border: 2px solid #333; border-radius: 8px;
    transition: background-color .2s;
  }
  button:hover { background: #ddd; }
  button:focus-visible, input:focus-visible { outline: 3px solid #8cf; outline-offset: 3px; }
  .hard-btn { border-color: #E1002A; color: #E1002A; }
  @media (max-width: 600px) {
    body { padding: 8px; }
    #menu h1 { font-size: 2.2rem; }
    #status { text-align: center; }
    #accessibilityControls { width: 100%; }
  }
</style>
</head>
<body>

<div id="bar">
  <div id="status" aria-live="polite"></div>
  <button id="pauseBtn">일시정지 (P)</button>
  <div id="accessibilityControls" aria-label="효과 접근성 설정">
    <label><input id="muteEffects" type="checkbox"> 효과 음소거</label>
    <label><input id="reduceMotion" type="checkbox"> 움직임 줄이기</label>
    <span id="effectStatus" aria-live="polite">효과 사건: 보스와 플레이어 충돌</span>
  </div>
</div>

<div id="menu"></div>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<div id="help">
  <p><b>규칙</b> 보스(😈)가 만드는 붉은 장판을 피해 50초를 버티면 <b>성공</b>, 체력(❤️ 3개)이 모두 닳으면 <b>실패</b>입니다.</p>
  <p>붉은 경고 모양이 차오르면 곧 폭발합니다. 맞으면 체력이 1 줄고 1초간 무적이 됩니다. 초록 원이 보이면 그 안이 안전지대입니다.</p>
  <p><b>조작</b> 이동: <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 또는 방향키 (🤺가 움직이고, 키 입력 한 건마다 '이동 입력'이 1회 늘어납니다) · 일시정지: <kbd>P</kbd> 또는 <kbd>Esc</kbd>, 버튼</p>
  <p><b>어려움</b> 마지막 10초에는 'Danger!' 발악 패턴이 나옵니다.</p>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const menuEl = document.getElementById('menu');
const statusEl = document.getElementById('status');
const pauseBtn = document.getElementById('pauseBtn');
const muteEffectsEl = document.getElementById('muteEffects');
const reduceMotionEl = document.getElementById('reduceMotion');
const effectStatusEl = document.getElementById('effectStatus');
const barEl = document.getElementById('bar');
const helpEl = document.getElementById('help');

const W = canvas.width, H = canvas.height, TAU = Math.PI * 2;

const ACCEL = 4, FRICTION = 0.7;
const SPAWN_INTERVAL = 2500;
const STEPS = [100, 200, 300];
const PATTERNS = ['homing', 'fullscreen', 'chain'];
const HOMING_MAX = 2, HOMING_LIFE = 2000;

const ZONE_TIMES = {
  cross: [1200, 300],
  outerSafe: [1500, 300],
  innerSafe: [1500, 300],
  sequenceSafe: [800, 200],
  complex: [1500, 300],
};

const boss = { x: W / 2, y: H / 2, size: 50, radius: 25 };

const player = {
  x: 0, y: 0, size: 40, radius: 20,
  vx: 0, vy: 0, bounceX: 0, bounceY: 0,
  hp: 3, invincible: 0
};

let phase = 'ready';
let mode = null, duration, hard, dead, moves = 0;
let raf = 0, last = 0, acc = 0, gameTime = 0;
let paused = false, away = false;
let zones = [], homing = [];
let lastSpawn = 0, lastType = null;
let enraged = false, pattern = null, bag = [], patternTime = 0, cooldown = 0;

// 선택한 사건: 보스와 플레이어의 충돌
const collisionFeedback = {
  x: 0, y: 0, remaining: 0, duration: 180
};

let collisionEffectCooldown = 0;
let audioContext = null;
let activeCollisionOscillator = null;
let activeCollisionGain = null;

function isMuted() {
  return muteEffectsEl.checked;
}

function isMotionReduced() {
  return reduceMotionEl.checked;
}

function updateEffectSettingsLabel() {
  const choices = [];

  if (isMuted()) choices.push('음소거 켬');
  if (isMotionReduced()) choices.push('움직임 줄이기 켬');

  effectStatusEl.textContent =
    '효과 사건: 보스와 플레이어 충돌 · ' +
    (choices.length ? choices.join(' / ') : '기본 효과');
}

function stopCollisionSound() {
  if (!activeCollisionOscillator) return;

  try {
    const now = audioContext ? audioContext.currentTime : 0;

    if (activeCollisionGain && audioContext) {
      activeCollisionGain.gain.cancelScheduledValues(now);
      activeCollisionGain.gain.setTargetAtTime(0.0001, now, 0.01);
    }

    activeCollisionOscillator.stop(now + 0.04);
  } catch (_) {
    // 이미 종료된 오실레이터는 추가 작업 없이 정리한다.
  }

  activeCollisionOscillator = null;
  activeCollisionGain = null;
}

function playCollisionSound() {
  if (isMuted()) return;

  const AudioContextClass =
    window.AudioContext || window.webkitAudioContext;

  if (!AudioContextClass) return;

  try {
    if (!audioContext) audioContext = new AudioContextClass();

    if (audioContext.state === 'suspended') {
      audioContext.resume().catch(() => {});
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const now = audioContext.currentTime;

    oscillator.type = 'triangle';
    oscillator.frequency.setValueAtTime(260, now);
    oscillator.frequency.exponentialRampToValueAtTime(115, now + 0.12);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.16, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    activeCollisionOscillator = oscillator;
    activeCollisionGain = gain;

    oscillator.onended = () => {
      if (activeCollisionOscillator === oscillator) {
        activeCollisionOscillator = null;
        activeCollisionGain = null;
      }

      oscillator.disconnect();
      gain.disconnect();
    };

    oscillator.start(now);
    oscillator.stop(now + 0.16);
  } catch (_) {
    // 오디오 기능을 지원하지 않는 브라우저에서도 게임 플레이는 계속된다.
  }
}

function triggerCollisionFeedback(x, y) {
  // 같은 접촉에서 효과가 매 프레임 반복되지 않도록 제한한다.
  if (collisionEffectCooldown > 0) return;

  collisionEffectCooldown = 450;
  collisionFeedback.x = x;
  collisionFeedback.y = y;
  collisionFeedback.remaining = collisionFeedback.duration;

  playCollisionSound();
}

muteEffectsEl.addEventListener('change', () => {
  if (isMuted()) stopCollisionSound();
  updateEffectSettingsLabel();
});

reduceMotionEl.addEventListener('change', () => {
  if (isMotionReduced()) {
    collisionFeedback.remaining =
      Math.min(collisionFeedback.remaining, 70);
  }

  updateEffectSettingsLabel();
});

/* 입력 */
const down = new Set();
const tapped = new Set();

const MOVE_KEYS = new Set([
  'w', 'a', 's', 'd',
  'arrowup', 'arrowdown', 'arrowleft', 'arrowright'
]);

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();

  if (e.key.startsWith('Arrow')) e.preventDefault();

  if ((k === 'p' || k === 'escape') && !e.repeat) {
    return setPaused(!paused);
  }

  if (phase !== 'playing' || paused || away) return;

  down.add(k);
  tapped.add(k);

  if (MOVE_KEYS.has(k)) {
    moves++;
    renderStatus();
  }
});

addEventListener('keyup', e => {
  down.delete(e.key.toLowerCase());
});

const key = (...names) =>
  names.some(k => down.has(k) || tapped.has(k)) ? 1 : 0;

/* 화면 상태 표시 */
const LABEL = {
  ready: '대기 중',
  playing: '진행 중',
  paused: '일시정지',
  won: '성공',
  lost: '실패'
};

const MODE_TEXT = {
  normal: '보통',
  hard: '어려움'
};

const timeLeft = () =>
  Math.max(0, Math.floor((duration - gameTime) / 1000));

function renderStatus() {
  const shown =
    phase === 'playing' && (paused || away) ? 'paused' : phase;

  const parts = [
    `상태: ${LABEL[shown]}${shown === 'paused' && !paused ? ' (창 포커스 없음)' : ''}`,
    `난이도: ${MODE_TEXT[mode] || '-'}`
  ];

  if (mode) {
    parts.push(
      `체력: ${'❤️'.repeat(player.hp)}`,
      `남은 시간: ${timeLeft()}초`
    );
  }

  parts.push(`이동 입력: ${moves}회`);

  const text = parts.join(' · ');

  if (statusEl.textContent !== text) {
    statusEl.textContent = text;
  }

  Object.assign(statusEl.dataset, {
    phase: shown,
    hp: player.hp,
    timeLeft: mode ? timeLeft() : '',
    moves,
    x: Math.round(player.x),
    y: Math.round(player.y)
  });

  const label = paused ? '재개 (P)' : '일시정지 (P)';

  if (pauseBtn.textContent !== label) {
    pauseBtn.textContent = label;
  }

  pauseBtn.style.visibility =
    phase === 'playing' ? 'visible' : 'hidden';

  updateEffectSettingsLabel();
}

/* 일시정지 및 포커스 이탈 */
function resetClock() {
  down.clear();
  tapped.clear();
  acc = 0;
  last = 0;
}

function setPaused(v) {
  if (phase !== 'playing' || paused === v) return;

  paused = v;
  resetClock();
  renderStatus();
}

function setAway(v) {
  if (away === v) return;

  away = v;
  resetClock();
  renderStatus();
}

addEventListener('blur', () => setAway(true));
addEventListener('focus', () => setAway(document.hidden));

document.addEventListener(
  'visibilitychange',
  () => setAway(document.hidden)
);

pauseBtn.addEventListener('click', () => setPaused(!paused));

/* 화면 크기 계산 */
function fit() {
  const used =
    barEl.offsetHeight + helpEl.offsetHeight + 24 + 16 + 8;

  document.documentElement.style.setProperty(
    '--canvas-h',
    Math.max(160, innerHeight - used) + 'px'
  );
}

addEventListener('resize', fit);

new ResizeObserver(fit).observe(barEl);
new ResizeObserver(fit).observe(helpEl);

/* 메뉴 */
function showMenu(title, text, ended) {
  const buttons = ended
    ? `<button data-action="restart">다시 시작 (${MODE_TEXT[mode]})</button>
       <button data-action="menu">난이도 선택으로</button>`
    : `<button data-mode="normal">보통 난이도 (50초)</button>
       <button data-mode="hard" class="hard-btn">어려움 난이도 (50초 + 발악 패턴)</button>`;

  menuEl.innerHTML =
    `<h1>${title}</h1><p>${text}</p>${buttons}`;

  menuEl.style.display = '';
  canvas.style.display = 'none';
}

menuEl.addEventListener('click', e => {
  const { mode: m, action } = e.target.dataset;

  if (m) startGame(m);
  else if (action === 'restart') startGame(mode);
  else if (action === 'menu') goReady();
});

function goReady() {
  cancelAnimationFrame(raf);

  phase = 'ready';
  mode = null;
  moves = 0;
  paused = away = false;

  renderStatus();
  showMenu('보스 피하기', '난이도를 선택해주세요.');
}

function endGame(won) {
  cancelAnimationFrame(raf);

  paused = away = false;
  phase = won ? 'won' : 'lost';

  renderStatus();

  showMenu(
    won ? '성공!' : '실패...',
    won
      ? `보스의 힘이 소진되었습니다. 남은 체력: ${'❤️'.repeat(player.hp)}`
      : '체력이 다했습니다.',
    true
  );
}

function startGame(m) {
  cancelAnimationFrame(raf);

  mode = m;
  hard = m === 'hard';
  duration = 50000;
  phase = 'playing';
  dead = false;
  moves = 0;
  paused = away = false;
  gameTime = 0;

  resetClock();

  menuEl.style.display = 'none';
  canvas.style.display = 'block';

  // 한 판의 상태 초기화
  Object.assign(player, {
    x: W / 2,
    y: H - 100,
    vx: 0,
    vy: 0,
    bounceX: 0,
    bounceY: 0,
    hp: 3,
    invincible: 0
  });

  zones = [];
  homing = [];
  lastSpawn = -Infinity;
  lastType = null;
  enraged = false;
  pattern = null;
  bag = [];
  patternTime = cooldown = 0;

  player.collidingWithBoss = false;
  collisionEffectCooldown = 0;
  collisionFeedback.remaining = 0;

  stopCollisionSound();

  // 오디오 자동 재생 제한 대응
  const AudioContextClass =
    window.AudioContext || window.webkitAudioContext;

  if (!audioContext && AudioContextClass) {
    try {
      audioContext = new AudioContextClass();
    } catch (_) {
      audioContext = null;
    }
  }

  if (audioContext && audioContext.state === 'suspended') {
    audioContext.resume().catch(() => {});
  }

  renderStatus();
  raf = requestAnimationFrame(frame);
}

/* 장판 */
const newZone = (
  type,
  warningDuration,
  explodeDuration,
  extra = {}
) => ({
  type,
  state: 'warning',
  timer: 0,
  warningDuration,
  explodeDuration,
  progress: 0,
  ...extra
});

// 십자 장판의 각도
const crossAngle = (z, p = 1) =>
  z.startAngle + (z.isRotating ? p * Math.PI / 4 : 0);

function spawnZone() {
  const r = Math.random();
  let type;

  if (lastType === 'outerSafe') {
    type = r < 0.8 ? 'cross' : 'innerSafe';
  } else if (lastType === 'innerSafe') {
    type = r < 0.8 ? 'cross' : 'outerSafe';
  } else {
    type =
      r < 0.25 ? 'cross' :
      r < 0.5 ? 'outerSafe' :
      r < 0.75 ? 'innerSafe' :
      r < 0.85 ? 'sequenceSafe' : 'complex';
  }

  lastType = type;

  let extra = {};

  if (type === 'cross') {
    extra = {
      isRotating: Math.random() < 0.5,
      startAngle: Math.PI / 4 *
        Math.floor(Math.random() * 4)
    };
  }

  if (type === 'sequenceSafe') {
    extra = { step: 0, stepTimer: 0 };
  }

  zones.push(newZone(type, ...ZONE_TIMES[type], extra));
}

// 장판 상태 갱신
function updateZone(z) {
  z.timer += 16;

  if (z.type === 'sequenceSafe') {
    z.stepTimer += 16;

    if (
      z.state === 'warning' &&
      z.stepTimer > z.warningDuration
    ) {
      z.state = 'exploding';
      z.stepTimer = 0;
      checkHit(z);

    } else if (
      z.state === 'exploding' &&
      z.stepTimer > z.explodeDuration
    ) {
      z.step++;
      z.state = 'warning';
      z.stepTimer = 0;

      return z.step < STEPS.length;
    }

  } else if (z.state === 'warning') {
    z.progress = z.timer / z.warningDuration;

    if (z.progress >= 1) {
      z.state = 'exploding';
      z.timer = 0;
      checkHit(z);
    }

  } else if (z.timer > z.explodeDuration) {
    return false;
  }

  return true;
}

function hurt() {
  if (player.invincible > 0) return;

  player.hp--;
  player.invincible = 1000;

  if (player.hp <= 0) dead = true;
}

// 장판 폭발 순간 피격 판정
function checkHit(z) {
  const dx = player.x - boss.x;
  const dy = player.y - boss.y;
  const d = Math.hypot(dx, dy);
  const r = player.radius;

  let hit = false;

  if (z.type === 'cross') {
    const a = -crossAngle(z);

    const rx = dx * Math.cos(a) - dy * Math.sin(a);
    const ry = dx * Math.sin(a) + dy * Math.cos(a);

    const arm = (across, along) =>
      Math.abs(across) < 30 + r &&
      Math.abs(along) < 500 + r;

    hit = arm(rx, ry) || arm(ry, rx);

  } else if (z.type === 'outerSafe') {
    hit = d < 250 + r;

  } else if (z.type === 'innerSafe') {
    hit = d > 130 - r;

  } else if (z.type === 'sequenceSafe') {
    const inner = z.step ? STEPS[z.step - 1] : 0;
    const outer = STEPS[z.step];

    hit = d > inner - r && d < outer + r;

  } else {
    const angle = (Math.atan2(dy, dx) + TAU) % TAU;

    const inSector = [1, 3, 5, 7].some(
      k => Math.abs(angle - k * Math.PI / 4) < Math.PI / 8
    );

    hit =
      d < 40 + r ||
      (d > 120 - r && d < 200 + r) ||
      (inSector && d < 500 + r);
  }

  if (hit) hurt();
}

/* 발악 패턴 */
function nextPattern() {
  if (!bag.length) {
    bag = [...PATTERNS];

    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }

    if (bag[0] === pattern) {
      bag.push(bag.shift());
    }
  }

  return bag.shift();
}

function runEnrage() {
  patternTime += 16;
  cooldown -= 16;

  if (!pattern || patternTime > 3000) {
    pattern = nextPattern();
    patternTime = cooldown = 0;
  }

  if (cooldown <= 0) {
    if (pattern === 'homing') {
      if (homing.length < HOMING_MAX) {
        homing.push({
          x: boss.x,
          y: boss.y,
          radius: 30,
          timer: 0
        });
      }

      cooldown = 1000;

    } else {
      if (!zones.length) {
        zones.push(
          pattern === 'fullscreen'
            ? newZone('outerSafe', 800, 200)
            : newZone(
                'cross',
                500,
                200,
                { isRotating: true, startAngle: 0 }
              )
        );
      }

      cooldown =
        pattern === 'fullscreen' ? 1500 : 2000;
    }
  }

  homing = homing.filter(h => {
    h.timer += 16;

    const dx = player.x - h.x;
    const dy = player.y - h.y;
    const d = Math.hypot(dx, dy);

    if (d > 0) {
      h.x += dx / d * 2.5;
      h.y += dy / d * 2.5;
    }

    if (h.timer <= HOMING_LIFE) return true;

    if (
      Math.hypot(player.x - h.x, player.y - h.y) <
      h.radius + player.radius
    ) {
      hurt();
    }

    return false;
  });
}

/* 플레이어 이동 */
function movePlayer() {
  let mx = key('d', 'arrowright') - key('a', 'arrowleft');
  let my = key('s', 'arrowdown') - key('w', 'arrowup');

  if (mx && my) {
    mx *= 0.707;
    my *= 0.707;
  }

  player.vx = (player.vx + mx * ACCEL) * FRICTION;
  player.vy = (player.vy + my * ACCEL) * FRICTION;

  if (Math.abs(player.vx) < 0.1) player.vx = 0;
  if (Math.abs(player.vy) < 0.1) player.vy = 0;

  player.bounceX *= 0.9;
  player.bounceY *= 0.9;

  let nx = player.x + player.vx + player.bounceX;
  let ny = player.y + player.vy + player.bounceY;

  // 보스와 충돌하는 순간에만 효과 실행
  const dx = nx - boss.x;
  const dy = ny - boss.y;
  const min = player.radius + boss.radius;

  if (Math.hypot(dx, dy) < min) {
    if (!player.collidingWithBoss) {
      triggerCollisionFeedback(nx, ny);
    }

    player.collidingWithBoss = true;

    const a = Math.atan2(dy, dx);

    nx = boss.x + Math.cos(a) * min;
    ny = boss.y + Math.sin(a) * min;

    player.bounceX = Math.cos(a) * 7;
    player.bounceY = Math.sin(a) * 7;

    player.vx *= 0.5;
    player.vy *= 0.5;

  } else {
    player.collidingWithBoss = false;
  }

  // 벽에 닿으면 멈춤
  const half = player.size / 2;

  player.x = nx;
  player.y = ny;

  if (nx < half || nx > W - half) {
    player.x = Math.min(Math.max(nx, half), W - half);
    player.vx = player.bounceX = 0;
  }

  if (ny < half || ny > H - half) {
    player.y = Math.min(Math.max(ny, half), H - half);
    player.vy = player.bounceY = 0;
  }
}

/* 그리기 */
const red = a => `rgba(255,0,0,${a})`;

function drawZone(z) {
  const warn = z.state === 'warning';
  const p = warn ? z.progress : 1;

  ctx.fillStyle = red(warn ? 0.4 : 0.8);
  ctx.strokeStyle = red(0.5);
  ctx.lineWidth = 2;

  const circle = (r, ccw) =>
    ctx.arc(boss.x, boss.y, r, 0, TAU, ccw);

  const paint = outline => {
    ctx.fill();
    if (warn && outline) ctx.stroke();
  };

  const ring = (inner, outer, outline) => {
    ctx.beginPath();
    circle(outer);
    circle(inner, true);
    paint(outline);
  };

  if (z.type === 'cross') {
    const arms = len => [
      [-30, -len, 60, len],
      [-30, 0, 60, len],
      [-len, -30, len, 60],
      [0, -30, len, 60]
    ];

    ctx.save();
    ctx.translate(boss.x, boss.y);
    ctx.rotate(crossAngle(z, p));

    if (warn) {
      arms(500).forEach(a => ctx.strokeRect(...a));
    }

    arms(500 * p).forEach(a => ctx.fillRect(...a));
    ctx.restore();

  } else if (z.type === 'outerSafe') {
    if (warn) {
      ctx.lineWidth = 3;
      ctx.beginPath();
      circle(250);
      ctx.stroke();
    }

    ctx.beginPath();
    circle(250 * p);
    ctx.fill();

  } else if (z.type === 'innerSafe') {
    const far = Math.hypot(W / 2, H / 2);

    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    circle(
      warn ? far - (far - 130) * p : 130,
      true
    );
    ctx.fill();

    ctx.strokeStyle = 'rgb(0,255,0)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    circle(130);
    ctx.stroke();

  } else if (z.type === 'sequenceSafe') {
    if (warn) {
      STEPS.forEach(r => {
        ctx.beginPath();
        circle(r);
        ctx.stroke();
      });
    }

    if (z.step < STEPS.length) {
      const inner = z.step ? STEPS[z.step - 1] : 0;
      const outer = STEPS[z.step];

      ring(
        inner,
        inner + (outer - inner) *
          (warn ? z.stepTimer / z.warningDuration : 1)
      );
    }

  } else {
    // complex: 중앙 원 + 고리 + 4방향 부채꼴
    ctx.beginPath();
    circle(40 * p);
    paint(true);

    if (p > 0) {
      ring(120, 120 + 80 * p, true);
    }

    ctx.save();
    ctx.translate(boss.x, boss.y);

    for (let i = 0; i < 4; i++) {
      ctx.save();
      ctx.rotate(Math.PI / 2 * i + Math.PI / 4);

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, 500 * p, -Math.PI / 8, Math.PI / 8);
      ctx.closePath();

      paint(true);
      ctx.restore();
    }

    ctx.restore();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();

  const effectProgress =
    collisionFeedback.remaining / collisionFeedback.duration;

  const shakeAllowed =
    !isMotionReduced() && collisionFeedback.remaining > 0;

  if (shakeAllowed) {
    const amplitude = 5 * effectProgress;

    ctx.translate(
      Math.sin(gameTime * 0.09) * amplitude,
      Math.cos(gameTime * 0.11) * amplitude
    );
  }

  zones.forEach(drawZone);

  homing.forEach(h => {
    ctx.beginPath();
    ctx.arc(h.x, h.y, h.radius, 0, TAU);
    ctx.fillStyle = red(0.6);
    ctx.fill();

    ctx.strokeStyle = 'rgb(255,100,100)';
    ctx.lineWidth = 3;
    ctx.stroke();
  });

  ctx.fillStyle = 'white';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = `${boss.size}px serif`;
  ctx.fillText('😈', boss.x, boss.y);

  ctx.globalAlpha = player.invincible > 0 ? 0.4 : 1;
  ctx.font = `${player.size}px serif`;
  ctx.fillText('🤺', player.x, player.y);
  ctx.globalAlpha = 1;

  // 충돌 시에만 표시되는 짧은 링
  if (collisionFeedback.remaining > 0) {
    const progress = 1 - effectProgress;

    const radius =
      isMotionReduced() ? 25 : 25 + progress * 32;

    const alpha =
      (isMotionReduced() ? 0.16 : 0.48) * effectProgress;

    ctx.beginPath();
    ctx.arc(
      collisionFeedback.x,
      collisionFeedback.y,
      radius,
      0,
      TAU
    );

    ctx.strokeStyle = `rgba(255,230,120,${alpha})`;
    ctx.lineWidth = isMotionReduced() ? 3 : 5;
    ctx.stroke();
  }

  ctx.font = '20px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`HP: ${'❤️'.repeat(player.hp)}`, 20, 30);

  ctx.textAlign = 'right';
  ctx.fillText(
    `남은 시간: ${Math.max(0, timeLeft())}초`,
    W - 20,
    30
  );

  if (enraged) {
    ctx.font = '30px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'red';
    ctx.fillText('Danger!', W / 2, 70);
  }

  if (paused || away) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.font = '40px sans-serif';

    ctx.fillText(
      paused ? '일시정지' : '창 포커스 없음',
      W / 2,
      H / 2 - 20
    );

    ctx.font = '20px sans-serif';

    ctx.fillText(
      paused
        ? 'P 키 또는 버튼으로 재개'
        : '창으로 돌아오면 이어집니다',
      W / 2,
      H / 2 + 25
    );
  }

  ctx.restore();
}

/* 게임 루프 */
const STEP = 16;

function frame(ts) {
  raf = requestAnimationFrame(frame);

  const dt = last ? Math.min(ts - last, 100) : 0;
  last = ts;

  if (!paused && !away) {
    acc += dt;

    while (acc >= STEP && phase === 'playing') {
      acc -= STEP;
      step();
    }
  }

  if (phase === 'playing') {
    draw();
    renderStatus();
  }
}

function step() {
  gameTime += STEP;

  if (gameTime >= duration) {
    return endGame(true);
  }

  if (hard && gameTime >= 40000) {
    enraged = true;
  }

  if (enraged) {
    runEnrage();
  } else if (gameTime - lastSpawn > SPAWN_INTERVAL) {
    lastSpawn = gameTime;
    spawnZone();
  }

  zones = zones.filter(updateZone);

  if (player.invincible > 0) {
    player.invincible -= STEP;
  }

  if (collisionEffectCooldown > 0) {
    collisionEffectCooldown =
      Math.max(0, collisionEffectCooldown - STEP);
  }

  if (collisionFeedback.remaining > 0) {
    collisionFeedback.remaining =
      Math.max(0, collisionFeedback.remaining - STEP);
  }

  movePlayer();
  tapped.clear();

  if (dead) {
    endGame(false);
  }
}

fit();
goReady();
</script>
</body>
