<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>미니게임 - 1단계</title>
  <style>
    body {
      margin: 0;
      background-color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: sans-serif;
    }
    /* 게임이 그려질 도화지(캔버스) */
    #gameCanvas {
      background-color: #333; /* 어두운 바닥 */
      border: 2px solid #555;
    }
  </style>
</head>
<body>

  <!-- 게임 화면(도화지) -->
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <script>
    // 1. 도화지(Canvas) 준비하기
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 2. 캐릭터 설정
    // 보스 (중앙 고정)
    const boss = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      size: 50,
      emoji: '😈'
    };

    // 유저 (움직이는 캐릭터)
    const player = {
      x: canvas.width / 2,
      y: canvas.height - 100, // 시작 위치는 아래쪽
      size: 40,
      emoji: '🤺',
      speed: 5 // 이동 속도
    };

    // 3. 키보드 입력 상태 저장
    const keys = {
      w: false, a: false, s: false, d: false,
      ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false
    };

    // 키보드 이벤트 리스너
    window.addEventListener('keydown', (e) => {
      // 화면 스크롤 방지
      if (e.key in keys) e.preventDefault(); 
      
      if (e.key === 'w' || e.key === 'W') keys.w = true;
      if (e.key === 'a' || e.key === 'A') keys.a = true;
      if (e.key === 's' || e.key === 'S') keys.s = true;
      if (e.key === 'd' || e.key === 'D') keys.d = true;
      
      if (e.key === 'ArrowUp') keys.ArrowUp = true;
      if (e.key === 'ArrowLeft') keys.ArrowLeft = true;
      if (e.key === 'ArrowDown') keys.ArrowDown = true;
      if (e.key === 'ArrowRight') keys.ArrowRight = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'w' || e.key === 'W') keys.w = false;
      if (e.key === 'a' || e.key === 'A') keys.a = false;
      if (e.key === 's' || e.key === 'S') keys.s = false;
      if (e.key === 'd' || e.key === 'D') keys.d = false;
      
      if (e.key === 'ArrowUp') keys.ArrowUp = false;
      if (e.key === 'ArrowLeft') keys.ArrowLeft = false;
      if (e.key === 'ArrowDown') keys.ArrowDown = false;
      if (e.key === 'ArrowRight') keys.ArrowRight = false;
    });

    // 4. 화면 그리기 (매 프레임마다 실행됨)
    function draw() {
      // 캔버스 지우기 (이전 그림 삭제)
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 보스 그리기 (이모지로)
      ctx.font = `${boss.size}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(boss.emoji, boss.x, boss.y);

      // 유저 그리기 (이모지로)
      ctx.font = `${player.size}px serif`;
      ctx.fillText(player.emoji, player.x, player.y);
    }

    // 5. 게임 루프 (실시간 업데이트)
    function update() {
      // 유저 이동 처리
      let moveX = 0;
      let moveY = 0;

      // WASD 또는 방향키 확인
      if (keys.w || keys.ArrowUp) moveY -= 1;
      if (keys.s || keys.ArrowDown) moveY += 1;
      if (keys.a || keys.ArrowLeft) moveX -= 1;
      if (keys.d || keys.ArrowRight) moveX += 1;

      // 대각선 이동 시 속도가 빨라지지 않도록 정규화
      if (moveX !== 0 && moveY !== 0) {
        moveX *= 0.707; // 1 / sqrt(2)
        moveY *= 0.707;
      }

      player.x += moveX * player.speed;
      player.y += moveY * player.speed;

      // 화면 밖으로 나가지 않도록 경계 체크
      if (player.x < player.size / 2) player.x = player.size / 2;
      if (player.x > canvas.width - player.size / 2) player.x = canvas.width - player.size / 2;
      if (player.y < player.size / 2) player.y = player.size / 2;
      if (player.y > canvas.height - player.size / 2) player.y = canvas.height - player.size / 2;

      // 다음 프레임 그리기
      draw();

      // 무한 루프
      requestAnimationFrame(update);
    }

    // 게임 시작!
    update();
  </script>
</body>
</html>
